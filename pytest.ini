[pytest]
# old/ holds the superseded v3.0 and v3.1 code beside its fitted pickles, plus the E1-E5
# suite and the first ladder, so the archive stays readable next to the results it
# produced. It also holds archived tests that collide with the live ones on module name --
# hence the exclusion rather than a rename, since renaming the archive would misrepresent
# what it is. release/ holds only data.
norecursedirs = old release .venv .report snapshot exp __pycache__ .ipynb_checkpoints .pytest_cache
testpaths = .
